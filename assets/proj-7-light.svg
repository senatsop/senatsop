<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 192" width="580" height="192" role="img" aria-label="clash-royale — Clash Royale inspired interactive browser combat project.">
  <title>clash-royale</title>
  <defs>
    <clipPath id="pclip">
      <rect width="580" height="192" rx="18"/>
    </clipPath>
    <linearGradient id="pbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E6EEFA"/>
    </linearGradient>
    <radialGradient id="pglow" cx="92%" cy="10%" r="60%">
      <stop offset="0%" stop-color="#4F46E5" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#4F46E5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="psheen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <style>
    .pw-slow  { animation: pscroll 22s linear infinite; }
    .pw-fast  { animation: pscroll-rev 13s linear infinite; }
    .p-sheen  { animation: psweep 8s ease-in-out 8.399999999999999s infinite; }
    .p-dot    { animation: pblink 2.4s ease-in-out infinite; }

    @keyframes pscroll {
      from { transform: translateX(0px); }
      to   { transform: translateX(-580px); }
    }
    @keyframes pscroll-rev {
      from { transform: translateX(-580px); }
      to   { transform: translateX(0px); }
    }
    @keyframes psweep {
      0%, 66% { transform: translateX(-640px); }
      100%    { transform: translateX(680px); }
    }
    @keyframes pblink {
      0%, 100% { opacity: 1; }
      50%      { opacity: 0.3; }
    }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>

  <g clip-path="url(#pclip)">
    <rect width="580" height="192" fill="url(#pbg)"/>
    <rect width="580" height="192" fill="url(#pglow)"/>

    <!-- Parallax micro-horizon ribbons -->
    <g class="pw-slow">
      <path d="M0 150 L20 151.3 L40 151.9 L60 152.1 L80 151.9 L100 151.7 L120 151.9 L140 152.5 L160 153.8 L180 155.7 L200 158 L220 160.4 L240 162.5 L260 163.8 L280 164.2 L300 163.3 L320 161.2 L340 158.1 L360 154.2 L380 150.1 L400 146.3 L420 143.1 L440 140.9 L460 140 L480 140.2 L500 141.5 L520 143.5 L540 145.8 L560 148.1 L580 150 L600 151.3 L620 151.9 L640 152.1 L660 151.9 L680 151.7 L700 151.9 L720 152.5 L740 153.8 L760 155.7 L780 158 L800 160.4 L820 162.5 L840 163.8 L860 164.2 L880 163.3 L900 161.2 L920 158.1 L940 154.2 L960 150.1 L980 146.3 L1000 143.1 L1020 140.9 L1040 140 L1060 140.2 L1080 141.5 L1100 143.5 L1120 145.8 L1140 148.1 L1160 150 L1160 192 L0 192 Z" fill="#4F46E5" fill-opacity="0.08"/>
      <path d="M0 150 L20 151.3 L40 151.9 L60 152.1 L80 151.9 L100 151.7 L120 151.9 L140 152.5 L160 153.8 L180 155.7 L200 158 L220 160.4 L240 162.5 L260 163.8 L280 164.2 L300 163.3 L320 161.2 L340 158.1 L360 154.2 L380 150.1 L400 146.3 L420 143.1 L440 140.9 L460 140 L480 140.2 L500 141.5 L520 143.5 L540 145.8 L560 148.1 L580 150 L600 151.3 L620 151.9 L640 152.1 L660 151.9 L680 151.7 L700 151.9 L720 152.5 L740 153.8 L760 155.7 L780 158 L800 160.4 L820 162.5 L840 163.8 L860 164.2 L880 163.3 L900 161.2 L920 158.1 L940 154.2 L960 150.1 L980 146.3 L1000 143.1 L1020 140.9 L1040 140 L1060 140.2 L1080 141.5 L1100 143.5 L1120 145.8 L1140 148.1 L1160 150" fill="none" stroke="#4F46E5" stroke-opacity="0.24" stroke-width="1"/>
    </g>
    <g class="pw-fast">
      <path d="M0 174.4 L20 175.2 L40 173.7 L60 170.1 L80 165.4 L100 160.7 L120 157.4 L140 156.3 L160 157.6 L180 160.9 L200 165 L220 168.9 L240 171.6 L260 172.7 L280 172.2 L300 170.7 L320 168.8 L340 167.1 L360 165.7 L380 164.6 L400 163.6 L420 162.5 L440 161.4 L460 160.6 L480 160.6 L500 161.9 L520 164.5 L540 168.1 L560 171.7 L580 174.4 L600 175.2 L620 173.7 L640 170.1 L660 165.4 L680 160.7 L700 157.4 L720 156.3 L740 157.6 L760 160.9 L780 165 L800 168.9 L820 171.6 L840 172.7 L860 172.2 L880 170.7 L900 168.8 L920 167.1 L940 165.7 L960 164.6 L980 163.6 L1000 162.5 L1020 161.4 L1040 160.6 L1060 160.6 L1080 161.9 L1100 164.5 L1120 168.1 L1140 171.7 L1160 174.4 L1160 192 L0 192 Z" fill="#4F46E5" fill-opacity="0.11"/>
      <path d="M0 174.4 L20 175.2 L40 173.7 L60 170.1 L80 165.4 L100 160.7 L120 157.4 L140 156.3 L160 157.6 L180 160.9 L200 165 L220 168.9 L240 171.6 L260 172.7 L280 172.2 L300 170.7 L320 168.8 L340 167.1 L360 165.7 L380 164.6 L400 163.6 L420 162.5 L440 161.4 L460 160.6 L480 160.6 L500 161.9 L520 164.5 L540 168.1 L560 171.7 L580 174.4 L600 175.2 L620 173.7 L640 170.1 L660 165.4 L680 160.7 L700 157.4 L720 156.3 L740 157.6 L760 160.9 L780 165 L800 168.9 L820 171.6 L840 172.7 L860 172.2 L880 170.7 L900 168.8 L920 167.1 L940 165.7 L960 164.6 L980 163.6 L1000 162.5 L1020 161.4 L1040 160.6 L1060 160.6 L1080 161.9 L1100 164.5 L1120 168.1 L1140 171.7 L1160 174.4" fill="none" stroke="#4F46E5" stroke-opacity="0.38" stroke-width="1.2"/>
    </g>

    <!-- Diagonal glass sheen -->
    <g transform="skewX(-18)">
      <rect class="p-sheen" x="0" y="0" width="110" height="192" fill="url(#psheen)"/>
    </g>

    <!-- Top Specular Line -->
    <line x1="22" y1="1" x2="558" y2="1" stroke="rgba(255,255,255,0.95)" stroke-width="1.2"/>

    <!-- Index & Status Badge -->
    <text x="26" y="34" fill="#64748B" font-family="'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="0.8">07 // senatsop/clash-royale</text>
    <rect x="480" y="17" width="76" height="24" rx="12" fill="rgba(255,255,255,0.86)" stroke="#4F46E5" stroke-opacity="0.55"/>
    <circle class="p-dot" cx="493" cy="29" r="3.2" fill="#4F46E5"/>
    <text x="524" y="33" text-anchor="middle" fill="#4F46E5" font-family="'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="700" letter-spacing="0.8">GAME</text>

    <!-- Title & Description -->
    <text x="26" y="74" fill="#0F172A" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="23" font-weight="800" letter-spacing="-0.4">clash-royale</text>
    <text x="26" y="102" fill="#475569" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="14">Clash Royale inspired interactive browser combat</text>
    <text x="26" y="123" fill="#475569" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="14">project.</text>

    <!-- Footer Stack & Action Cue -->
    <text x="26" y="164" fill="#4F46E5" font-family="'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="600">HTML5 · CSS3 · JavaScript</text>
    <text x="554" y="164" text-anchor="end" fill="#0F172A" font-family="'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700" opacity="0.85">OPEN REPO ↗</text>

    <rect x="0.75" y="0.75" width="578.5" height="190.5" rx="17.5" fill="none" stroke="rgba(15,23,42,0.12)" stroke-width="1.5"/>
  </g>
</svg>