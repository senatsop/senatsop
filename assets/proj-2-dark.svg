<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 192" width="580" height="192" role="img" aria-label="loadwise — Student academic load manager, constraint-based scheduler, OCR reader, and timetable studio.">
  <title>loadwise</title>
  <defs>
    <clipPath id="pclip">
      <rect width="580" height="192" rx="18"/>
    </clipPath>
    <linearGradient id="pbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040712"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <radialGradient id="pglow" cx="92%" cy="10%" r="60%">
      <stop offset="0%" stop-color="#2DD4BF" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#2DD4BF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="psheen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <style>
    .pw-slow  { animation: pscroll 22s linear infinite; }
    .pw-fast  { animation: pscroll-rev 13s linear infinite; }
    .p-sheen  { animation: psweep 8s ease-in-out 1.4s infinite; }
    .p-dot    { animation: pblink 2.4s ease-in-out infinite; }

    @keyframes pscroll {
      from { transform: translateX(0px); }
      to   { transform: translateX(-580px); }
    }
    @keyframes pscroll-rev {
      from { transform: translateX(-580px); }
      to   { transform: translateX(0px); }
    }
    @keyframes psweep {
      0%, 66% { transform: translateX(-640px); }
      100%    { transform: translateX(680px); }
    }
    @keyframes pblink {
      0%, 100% { opacity: 1; }
      50%      { opacity: 0.3; }
    }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>

  <g clip-path="url(#pclip)">
    <rect width="580" height="192" fill="url(#pbg)"/>
    <rect width="580" height="192" fill="url(#pglow)"/>

    <!-- Parallax micro-horizon ribbons -->
    <g class="pw-slow">
      <path d="M0 164 L20 164.9 L40 164.6 L60 163.1 L80 160.9 L100 158.2 L120 155.5 L140 153.2 L160 151.4 L180 150.4 L200 150.1 L220 150.1 L240 150.4 L260 150.5 L280 150.2 L300 149.4 L320 148 L340 146.1 L360 144.1 L380 142.4 L400 141.2 L420 140.9 L440 141.8 L460 143.8 L480 146.9 L500 150.7 L520 154.7 L540 158.6 L560 161.8 L580 164 L600 164.9 L620 164.6 L640 163.1 L660 160.9 L680 158.2 L700 155.5 L720 153.2 L740 151.4 L760 150.4 L780 150.1 L800 150.1 L820 150.4 L840 150.5 L860 150.2 L880 149.4 L900 148 L920 146.1 L940 144.1 L960 142.4 L980 141.2 L1000 140.9 L1020 141.8 L1040 143.8 L1060 146.9 L1080 150.7 L1100 154.7 L1120 158.6 L1140 161.8 L1160 164 L1160 192 L0 192 Z" fill="#2DD4BF" fill-opacity="0.09"/>
      <path d="M0 164 L20 164.9 L40 164.6 L60 163.1 L80 160.9 L100 158.2 L120 155.5 L140 153.2 L160 151.4 L180 150.4 L200 150.1 L220 150.1 L240 150.4 L260 150.5 L280 150.2 L300 149.4 L320 148 L340 146.1 L360 144.1 L380 142.4 L400 141.2 L420 140.9 L440 141.8 L460 143.8 L480 146.9 L500 150.7 L520 154.7 L540 158.6 L560 161.8 L580 164 L600 164.9 L620 164.6 L640 163.1 L660 160.9 L680 158.2 L700 155.5 L720 153.2 L740 151.4 L760 150.4 L780 150.1 L800 150.1 L820 150.4 L840 150.5 L860 150.2 L880 149.4 L900 148 L920 146.1 L940 144.1 L960 142.4 L980 141.2 L1000 140.9 L1020 141.8 L1040 143.8 L1060 146.9 L1080 150.7 L1100 154.7 L1120 158.6 L1140 161.8 L1160 164" fill="none" stroke="#2DD4BF" stroke-opacity="0.24" stroke-width="1"/>
    </g>
    <g class="pw-fast">
      <path d="M0 174.2 L20 175.6 L40 174.7 L60 171.5 L80 166.9 L100 162.1 L120 158.3 L140 156.7 L160 157.4 L180 160 L200 163.7 L220 167.4 L240 170.2 L260 171.6 L280 171.7 L300 170.8 L320 169.5 L340 168.3 L360 167.2 L380 166.1 L400 164.8 L420 163.2 L440 161.5 L460 160 L480 159.5 L500 160.5 L520 163 L540 166.8 L560 170.9 L580 174.2 L600 175.6 L620 174.7 L640 171.5 L660 166.9 L680 162.1 L700 158.3 L720 156.7 L740 157.4 L760 160 L780 163.7 L800 167.4 L820 170.2 L840 171.6 L860 171.7 L880 170.8 L900 169.5 L920 168.3 L940 167.2 L960 166.1 L980 164.8 L1000 163.2 L1020 161.5 L1040 160 L1060 159.5 L1080 160.5 L1100 163 L1120 166.8 L1140 170.9 L1160 174.2 L1160 192 L0 192 Z" fill="#2DD4BF" fill-opacity="0.13"/>
      <path d="M0 174.2 L20 175.6 L40 174.7 L60 171.5 L80 166.9 L100 162.1 L120 158.3 L140 156.7 L160 157.4 L180 160 L200 163.7 L220 167.4 L240 170.2 L260 171.6 L280 171.7 L300 170.8 L320 169.5 L340 168.3 L360 167.2 L380 166.1 L400 164.8 L420 163.2 L440 161.5 L460 160 L480 159.5 L500 160.5 L520 163 L540 166.8 L560 170.9 L580 174.2 L600 175.6 L620 174.7 L640 171.5 L660 166.9 L680 162.1 L700 158.3 L720 156.7 L740 157.4 L760 160 L780 163.7 L800 167.4 L820 170.2 L840 171.6 L860 171.7 L880 170.8 L900 169.5 L920 168.3 L940 167.2 L960 166.1 L980 164.8 L1000 163.2 L1020 161.5 L1040 160 L1060 159.5 L1080 160.5 L1100 163 L1120 166.8 L1140 170.9 L1160 174.2" fill="none" stroke="#2DD4BF" stroke-opacity="0.38" stroke-width="1.2"/>
    </g>

    <!-- Diagonal glass sheen -->
    <g transform="skewX(-18)">
      <rect class="p-sheen" x="0" y="0" width="110" height="192" fill="url(#psheen)"/>
    </g>

    <!-- Top Specular Line -->
    <line x1="22" y1="1" x2="558" y2="1" stroke="rgba(255,255,255,0.16)" stroke-width="1.2"/>

    <!-- Index & Status Badge -->
    <text x="26" y="34" fill="#64748B" font-family="'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="0.8">02 // senatsop/loadwise</text>
    <rect x="469.2" y="17" width="86.8" height="24" rx="12" fill="rgba(10,17,36,0.78)" stroke="#2DD4BF" stroke-opacity="0.55"/>
    <circle class="p-dot" cx="482.2" cy="29" r="3.2" fill="#2DD4BF"/>
    <text x="518.6" y="33" text-anchor="middle" fill="#2DD4BF" font-family="'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="700" letter-spacing="0.8">AI / OCR</text>

    <!-- Title & Description -->
    <text x="26" y="74" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="23" font-weight="800" letter-spacing="-0.4">loadwise</text>
    <text x="26" y="102" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="14">Student academic load manager, constraint-based</text>
    <text x="26" y="123" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="14">scheduler, OCR reader, and timetable studio.</text>

    <!-- Footer Stack & Action Cue -->
    <text x="26" y="164" fill="#2DD4BF" font-family="'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="600">TypeScript · OCR · Scheduling</text>
    <text x="554" y="164" text-anchor="end" fill="#F8FAFC" font-family="'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700" opacity="0.85">OPEN REPO ↗</text>

    <rect x="0.75" y="0.75" width="578.5" height="190.5" rx="17.5" fill="none" stroke="rgba(148,163,184,0.22)" stroke-width="1.5"/>
  </g>
</svg>