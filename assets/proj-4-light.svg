<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 192" width="580" height="192" role="img" aria-label="antigravity-discord-controller — Antigravity IDE × Discord remote control and live notification system.">
  <title>antigravity-discord-controller</title>
  <defs>
    <clipPath id="pclip">
      <rect width="580" height="192" rx="18"/>
    </clipPath>
    <linearGradient id="pbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E6EEFA"/>
    </linearGradient>
    <radialGradient id="pglow" cx="92%" cy="10%" r="60%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="psheen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <style>
    .pw-slow  { animation: pscroll 22s linear infinite; }
    .pw-fast  { animation: pscroll-rev 13s linear infinite; }
    .p-sheen  { animation: psweep 8s ease-in-out 4.199999999999999s infinite; }
    .p-dot    { animation: pblink 2.4s ease-in-out infinite; }

    @keyframes pscroll {
      from { transform: translateX(0px); }
      to   { transform: translateX(-580px); }
    }
    @keyframes pscroll-rev {
      from { transform: translateX(-580px); }
      to   { transform: translateX(0px); }
    }
    @keyframes psweep {
      0%, 66% { transform: translateX(-640px); }
      100%    { transform: translateX(680px); }
    }
    @keyframes pblink {
      0%, 100% { opacity: 1; }
      50%      { opacity: 0.3; }
    }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>

  <g clip-path="url(#pclip)">
    <rect width="580" height="192" fill="url(#pbg)"/>
    <rect width="580" height="192" fill="url(#pglow)"/>

    <!-- Parallax micro-horizon ribbons -->
    <g class="pw-slow">
      <path d="M0 160.8 L20 158.8 L40 155.9 L60 152.3 L80 148.3 L100 144.6 L120 141.4 L140 139.3 L160 138.4 L180 138.9 L200 140.5 L220 143 L240 146.1 L260 149.2 L280 151.9 L300 154.1 L320 155.4 L340 156 L360 155.9 L380 155.5 L400 155.1 L420 155 L440 155.3 L460 156.2 L480 157.5 L500 159.1 L520 160.5 L540 161.4 L560 161.6 L580 160.8 L600 158.8 L620 155.9 L640 152.3 L660 148.3 L680 144.6 L700 141.4 L720 139.3 L740 138.4 L760 138.9 L780 140.5 L800 143 L820 146.1 L840 149.2 L860 151.9 L880 154.1 L900 155.4 L920 156 L940 155.9 L960 155.5 L980 155.1 L1000 155 L1020 155.3 L1040 156.2 L1060 157.5 L1080 159.1 L1100 160.5 L1120 161.4 L1140 161.6 L1160 160.8 L1160 192 L0 192 Z" fill="#7C3AED" fill-opacity="0.08"/>
      <path d="M0 160.8 L20 158.8 L40 155.9 L60 152.3 L80 148.3 L100 144.6 L120 141.4 L140 139.3 L160 138.4 L180 138.9 L200 140.5 L220 143 L240 146.1 L260 149.2 L280 151.9 L300 154.1 L320 155.4 L340 156 L360 155.9 L380 155.5 L400 155.1 L420 155 L440 155.3 L460 156.2 L480 157.5 L500 159.1 L520 160.5 L540 161.4 L560 161.6 L580 160.8 L600 158.8 L620 155.9 L640 152.3 L660 148.3 L680 144.6 L700 141.4 L720 139.3 L740 138.4 L760 138.9 L780 140.5 L800 143 L820 146.1 L840 149.2 L860 151.9 L880 154.1 L900 155.4 L920 156 L940 155.9 L960 155.5 L980 155.1 L1000 155 L1020 155.3 L1040 156.2 L1060 157.5 L1080 159.1 L1100 160.5 L1120 161.4 L1140 161.6 L1160 160.8" fill="none" stroke="#7C3AED" stroke-opacity="0.24" stroke-width="1"/>
    </g>
    <g class="pw-fast">
      <path d="M0 162.6 L20 162.2 L40 161.9 L60 161.7 L80 161.9 L100 162.8 L120 164.7 L140 167.4 L160 170.5 L180 173.2 L200 174.5 L220 173.8 L240 170.9 L260 166.6 L280 161.9 L300 158 L320 156.1 L340 156.7 L360 159.6 L380 163.9 L400 168.4 L420 171.9 L440 173.7 L460 173.5 L480 171.8 L500 169.2 L520 166.6 L540 164.6 L560 163.3 L580 162.6 L600 162.2 L620 161.9 L640 161.7 L660 161.9 L680 162.8 L700 164.7 L720 167.4 L740 170.5 L760 173.2 L780 174.5 L800 173.8 L820 170.9 L840 166.6 L860 161.9 L880 158 L900 156.1 L920 156.7 L940 159.6 L960 163.9 L980 168.4 L1000 171.9 L1020 173.7 L1040 173.5 L1060 171.8 L1080 169.2 L1100 166.6 L1120 164.6 L1140 163.3 L1160 162.6 L1160 192 L0 192 Z" fill="#7C3AED" fill-opacity="0.11"/>
      <path d="M0 162.6 L20 162.2 L40 161.9 L60 161.7 L80 161.9 L100 162.8 L120 164.7 L140 167.4 L160 170.5 L180 173.2 L200 174.5 L220 173.8 L240 170.9 L260 166.6 L280 161.9 L300 158 L320 156.1 L340 156.7 L360 159.6 L380 163.9 L400 168.4 L420 171.9 L440 173.7 L460 173.5 L480 171.8 L500 169.2 L520 166.6 L540 164.6 L560 163.3 L580 162.6 L600 162.2 L620 161.9 L640 161.7 L660 161.9 L680 162.8 L700 164.7 L720 167.4 L740 170.5 L760 173.2 L780 174.5 L800 173.8 L820 170.9 L840 166.6 L860 161.9 L880 158 L900 156.1 L920 156.7 L940 159.6 L960 163.9 L980 168.4 L1000 171.9 L1020 173.7 L1040 173.5 L1060 171.8 L1080 169.2 L1100 166.6 L1120 164.6 L1140 163.3 L1160 162.6" fill="none" stroke="#7C3AED" stroke-opacity="0.38" stroke-width="1.2"/>
    </g>

    <!-- Diagonal glass sheen -->
    <g transform="skewX(-18)">
      <rect class="p-sheen" x="0" y="0" width="110" height="192" fill="url(#psheen)"/>
    </g>

    <!-- Top Specular Line -->
    <line x1="22" y1="1" x2="558" y2="1" stroke="rgba(255,255,255,0.95)" stroke-width="1.2"/>

    <!-- Index & Status Badge -->
    <text x="26" y="34" fill="#64748B" font-family="'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="0.8">04 // senatsop/antigravity-discord-controller</text>
    <rect x="446.4" y="17" width="109.6" height="24" rx="12" fill="rgba(255,255,255,0.86)" stroke="#7C3AED" stroke-opacity="0.55"/>
    <circle class="p-dot" cx="459.4" cy="29" r="3.2" fill="#7C3AED"/>
    <text x="507.20000000000005" y="33" text-anchor="middle" fill="#7C3AED" font-family="'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="700" letter-spacing="0.8">DISCORD BOT</text>

    <!-- Title & Description -->
    <text x="26" y="74" fill="#0F172A" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="23" font-weight="800" letter-spacing="-0.4">antigravity-discord-controller</text>
    <text x="26" y="102" fill="#475569" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="14">Antigravity IDE × Discord remote control and live</text>
    <text x="26" y="123" fill="#475569" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="14">notification system.</text>

    <!-- Footer Stack & Action Cue -->
    <text x="26" y="164" fill="#7C3AED" font-family="'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="600">JavaScript · Discord Bot · Automation</text>
    <text x="554" y="164" text-anchor="end" fill="#0F172A" font-family="'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700" opacity="0.85">OPEN REPO ↗</text>

    <rect x="0.75" y="0.75" width="578.5" height="190.5" rx="17.5" fill="none" stroke="rgba(15,23,42,0.12)" stroke-width="1.5"/>
  </g>
</svg>