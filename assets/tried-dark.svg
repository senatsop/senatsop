    <text x="24" y="24" fill="#38BDF8" font-family="'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700" letter-spacing="1.4">// TRIAL_LAB // ACCURATE REPO TELEMETRY ACROSS ALL 21 REPOSITORIES</text>
    <rect x="960" y="12" width="216" height="18" rx="9" fill="rgba(45,212,191,0.12)" stroke="rgba(45,212,191,0.35)"/>
    <circle class="pulse-red" cx="972" cy="21" r="3" fill="#2DD4BF"/>
    <text x="984" y="24" fill="#2DD4BF" font-family="'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" font-weight="700">VERIFIED DATA // 21 REPOS</text>

