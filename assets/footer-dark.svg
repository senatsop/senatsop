      from { transform: translateX(0px); }
      to   { transform: translateX(-1200px); }
    }
    @keyframes wave-rev {
      from { transform: translateX(-1200px); }
      to   { transform: translateX(0px); }
    }
    @keyframes glow {
      0%, 100% { opacity: 1; }
      50%      { opacity: 0.3; }
    }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>

